# Gateway configuration.
#
# Copy to gateway.yaml and edit. gateway.yaml is gitignored because it holds
# API key secrets; only this example is committed. The gateway never logs a
# key: usage rows and log lines carry the key's `id` instead.

version: 1

# Model routing by prefix. The first matching prefix wins, so put the more
# specific prefixes first. A model matching nothing returns 400.
routes:
  - prefix: "gpt-"
    provider: openai
  - prefix: "o1"
    provider: openai
  - prefix: "o3"
    provider: openai
  - prefix: "o4"
    provider: openai
  - prefix: "claude-"
    provider: anthropic
  # Self-hosted models served by Ollama. These prefixes are only examples:
  # route whatever names `ollama list` shows on your own machine, and put a
  # longer prefix before a shorter one that would also match it. They carry
  # the version digit, as Ollama's own names do (llama3.2, not llama-3), so
  # a name in some other shape still falls through to a 400 rather than
  # being sent to a model that does not exist.
  - prefix: "llama3"
    provider: ollama
  - prefix: "llama2"
    provider: ollama
  - prefix: "qwen"
    provider: ollama
  - prefix: "mistral"
    provider: ollama
  - prefix: "gemma"
    provider: ollama
  - prefix: "phi"
    provider: ollama
  # Used by the tests and scripts/bench_gateway.py. Harmless to leave in: it
  # never reaches a network.
  - prefix: "fake-"
    provider: fake

# Session state for /v1/responses, so previous_response_id works against
# Anthropic as well as OpenAI.
sessions:
  backend: sqlite            # sqlite (default) or redis
  ttl_seconds: 3600
  redis_url: "redis://127.0.0.1:6379/0"

defaults:
  # Anthropic requires max_tokens. A request that omits it gets this.
  max_tokens: 1024

# Per-provider settings. OpenAI and Anthropic take their endpoint and their
# key from the environment, because a key does not belong in a file that is
# meant to be readable. Ollama has no key and runs wherever you put it, so
# its address lives here.
providers:
  ollama:
    base_url: "http://localhost:11434/v1"
    # A first request can be slow while the model is loaded into memory.
    timeout_seconds: 120

# Keys the gateway accepts. `id` is what appears in usage rows and logs.
# monthly_budget_usd is an estimate against the configured price table; omit
# it for no limit.
keys:
  - key: "replace-me-with-a-real-secret"
    id: "demo"
    monthly_budget_usd: 5.0
