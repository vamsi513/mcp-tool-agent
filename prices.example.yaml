# Price table used to turn recorded token counts into an estimated cost.
#
# Schema
# ------
# currency: string label shown in reports (default USD).
# models:
#   <model-name>:
#     input_per_million:  cost per 1,000,000 input (prompt) tokens
#     output_per_million: cost per 1,000,000 output (completion) tokens
#
# Every value here is 0.0 on purpose. This repository does not ship provider
# prices, because they change and a stale number in version control is worse
# than no number. Copy this file to prices.yaml and fill in the rates from
# your provider's current pricing page. Until you do, reports will show a
# cost of 0 and say so.
#
# A model that is not listed gets a null cost in reports and is named under
# `models_without_prices`, so missing configuration is visible rather than
# silently counted as free.

version: 1
currency: USD

models:
  gpt-4o-mini:
    input_per_million: 0.0
    output_per_million: 0.0
  gpt-4o:
    input_per_million: 0.0
    output_per_million: 0.0
